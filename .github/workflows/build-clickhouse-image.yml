name: Build ClickHouse Test Image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docker/clickhouse/**'
      - 'data/**'

env:
  IMAGE_NAME: cbioportal/clickhouse-test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build ClickHouse test data image
        run: |
          chmod +x docker/clickhouse/build.sh
          docker/clickhouse/build.sh ${{ env.IMAGE_NAME }}:latest

      - name: Push image
        run: docker push ${{ env.IMAGE_NAME }}:latest
